*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#151b2e;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:11pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{padding:0}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;border-bottom:.6mm solid #a8803a;padding-bottom:3mm;margin-bottom:5mm}
.head .cls{color:#8a6a2c;font-size:9pt;font-weight:600}
.head h1{font-family:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:17pt;font-weight:600;margin:1mm 0 0;line-height:1.25}

.sum{display:flex;gap:4mm;margin:0 0 5mm;flex-wrap:wrap}

.sum span{font-size:8.5pt;color:#4a5068}
table{width:100%;border-collapse:collapse;font-size:10pt}
th,td{border:.25mm solid #cfc8b8;padding:1.8mm 2.2mm;text-align:right;vertical-align:top}

td.ltr{direction:ltr;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.blank{min-width:40mm}
tr{break-inside:avoid}
thead{display:table-header-group}
.note{color:#4a5068;font-size:9pt;margin:4mm 0 0}
